<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body>

    <div class="container mt-5">

        <h1 class="mb-4">Store Analytics</h1>

        <h3>Add Product</h3>

        <form id="productForm" class="mb-4">
            <div class="mb-3">
                <input id="name" class="form-control" placeholder="Name" required>
            </div>
            <div class="mb-3">
                <input id="category" class="form-control" placeholder="Category" required>
            </div>
            <div class="mb-3">
                <input id="price" class="form-control" type="number" step="0.01" placeholder="Price" required>
            </div>
            <div class="mb-3">
                <input id="quantities" class="form-control" placeholder="Warehouse quantities (5,3,2)">
            </div>
            <div class="mb-3">
                <input id="specs" class="form-control" placeholder="specs (cpu=i7,ram=16gb)">
            </div>
            <button type="submit" class="btn btn-primary w-100">Add Product</button>
        </form>

        <div class="row mb-3">
            <div class="col-md-6 mb-2">
                <input id="filter" class="form-control" placeholder="Search products">
            </div>
            <div class="col-md-6">
                <select id="sort" class="form-select">
                    <option value="price">Sort by price</option>
                    <option value="name">Sort by name</option>
                </select>
            </div>
        </div>

       <div id="products" class="row row-cols-1 row-cols-md-3 g-4"></div>
        
    </div>

    <script type="module" src="./dist/ui/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
